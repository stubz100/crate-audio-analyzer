[project]
name = "crate"
version = "0.1.0"
description = "A local similarity-search and mapping tool for a large sample library, built for a Bitwig Studio workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    # Phase 1 runtime: the scanner (node A) imports soundfile unconditionally
    # (2026-09-06 review — a fresh `uv sync` must be enough to run Phase 1).
    "numpy>=1.26",
    "soundfile>=0.12",
    # Phase 2 runtime: analysis (nodes B/C) needs librosa. Its phase has
    # arrived, so it moves to base — same rule that moved soundfile here.
    "librosa>=0.10",
    "scipy>=1.11",
]

# Added incrementally as later phases need them — see .docs/samples_final.md §12.
# Not installed by default; use `uv sync --extra ml` etc. when a phase calls for it.
# A phase's deps move to the base set when that phase arrives (soundfile in
# Phase 1, librosa in Phase 2), so there is no `analysis` extra any more.
# aubio was evaluated and dropped — source-only distribution (no wheels since 2019)
# means a hidden MSVC toolchain dependency, GPLv3, and it optimizes descriptor
# extraction, which isn't the bottleneck. See .docs/samples_final.md §10.
[project.optional-dependencies]
# Phase 4/5: CLAP embeddings, Qwen2-Audio captioning/latent spike.
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "laion-clap",
]
# Phase 6: 2D projection for the map view.
map = [
    "umap-learn>=0.5",
]

[project.scripts]
crate = "crate.main:main"
crate-scan = "crate.cli:scan_main"
crate-analyze = "crate.cli:analyze_main"
crate-segment = "crate.cli:segment_main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]
